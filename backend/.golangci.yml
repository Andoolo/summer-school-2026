version: "2"

linters:
  default: standard

  settings:
    errcheck:
      # Отложенные Close и Rollback: ошибку тут игнорируют намеренно.
      #
      # Rollback после успешного Commit всегда возвращает ErrTxClosed — это штатный
      # исход, а не сбой. Close на соединении, которое мы всё равно бросаем, тоже
      # ни на что не влияет: возвращать оттуда ошибку некуда, а маскировать ею
      # настоящую ошибку из тела функции — хуже, чем не проверять.
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback

formatters:
  enable:
    - gofmt
