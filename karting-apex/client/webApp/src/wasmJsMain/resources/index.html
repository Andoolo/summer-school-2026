<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Апекс · картинг</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #compose-root {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* ===================================================================
           Прелоадер: пока грузится и компилируется wasm-бандл (~13 МБ), экран
           был бы просто белым несколько секунд. Вместо этого — гоночная сцена:
           гаснут стартовые огни, болид уходит по трассе, за ним заполняется
           полоса и к финишу переходит в клетчатый флаг.
           =================================================================== */
        #loading-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #ffffff;
            z-index: 10;
            transition: opacity .3s ease;
        }

        /* Финиш: клетчатый флаг на весь экран перед тем, как показать приложение. */
        #loading-overlay.finishing {
            background-image: repeating-conic-gradient(#161616 0 25%, #ffffff 0 50%);
            background-size: 28px 28px;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-overlay.finishing .loader-box,
        #loading-overlay.finishing .loader-brand { opacity: 0; transition: opacity .12s ease; }

        /* --p — прогресс заезда 0..1: общий источник и для положения болида,
           и для заполнения трассы. Ведётся из JS (см. скрипт ниже), а не
           ключевыми кадрами: длительность загрузки заранее неизвестна, поэтому
           анимация не может быть зациклена по времени. */
        .loader-box { width: min(320px, 78vw); --p: 0; }

        /* --- стартовые огни: проигрываются один раз, гаснут = отмашка --- */
        .loader-lights {
            display: flex;
            gap: 7px;
            justify-content: center;
            /* болид выступает над полосой примерно на 37px — оставляем ему место */
            margin-bottom: 46px;
        }
        .loader-lights b {
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d4d4d8;
            animation-duration: .75s;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }
        .loader-lights b:nth-child(1) { animation-name: lamp1 }
        .loader-lights b:nth-child(2) { animation-name: lamp2 }
        .loader-lights b:nth-child(3) { animation-name: lamp3 }
        .loader-lights b:nth-child(4) { animation-name: lamp4 }
        .loader-lights b:nth-child(5) { animation-name: lamp5 }

        @keyframes lamp1 { 0%,8%{background:#d4d4d8}  12%,74%{background:#E10600} 78%,100%{background:#d4d4d8} }
        @keyframes lamp2 { 0%,20%{background:#d4d4d8} 24%,74%{background:#E10600} 78%,100%{background:#d4d4d8} }
        @keyframes lamp3 { 0%,32%{background:#d4d4d8} 36%,74%{background:#E10600} 78%,100%{background:#d4d4d8} }
        @keyframes lamp4 { 0%,44%{background:#d4d4d8} 48%,74%{background:#E10600} 78%,100%{background:#d4d4d8} }
        @keyframes lamp5 { 0%,56%{background:#d4d4d8} 60%,74%{background:#E10600} 78%,100%{background:#d4d4d8} }

        /* --- трасса --- */
        .loader-track { position: relative; }

        .loader-road {
            position: relative;
            height: 22px;
            border-radius: 4px;
            background: #2b2b2e;
            overflow: hidden;
        }
        /* поребрик только по нижней кромке: болид едет по верхней, и пёстрая
           красно-белая лента сверху конкурировала бы с ним за внимание */
        .loader-road::after {
            content: "";
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 3px;
            z-index: 2;
            background: repeating-linear-gradient(90deg, #E10600 0 13px, #e8e8ea 13px 26px);
        }

        .loader-dash {
            position: absolute;
            left: 0; right: 0; top: 50%;
            height: 2px;
            margin-top: -1px;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 14px, transparent 14px 30px);
        }

        .loader-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: calc(100% * var(--p));
            overflow: hidden;
            background: linear-gradient(90deg, rgba(225,6,0,.25), rgba(225,6,0,.75));
        }
        /* клетка налетает только на финишном рывке — как надвигающаяся финишная черта */
        .loader-fill::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: repeating-conic-gradient(#161616 0 25%, #fff 0 50%);
            background-size: 13px 13px;
            clip-path: inset(0 100% 0 0);
        }
        #loading-overlay.finish .loader-fill::after {
            animation: flagWipe .43s cubic-bezier(.33,0,.2,1) forwards;
        }

        /* --- болид ---
           Едет ПОВЕРХ полосы, а не внутри неё: кузов графитовый, и на тёмном
           асфальте он бы слился. Так силуэт читается на светлом фоне, а колёса
           стоят на верхней кромке трассы. */
        .loader-kart {
            position: absolute;
            bottom: 16px;
            /* нос болида приходит ровно на финишную черту при --p = 1 */
            left: calc((100% - 132px) * var(--p));
            width: 132px;
            height: auto;
            z-index: 4;
            animation: kartShake .09s linear infinite;
        }
        /* колёса стоят на решётке и раскручиваются после отмашки */
        .loader-kart .whl {
            transform-box: fill-box;
            transform-origin: center;
            animation: wheelSpin .5s linear .59s infinite;
        }
        #loading-overlay.finish .loader-kart .whl { animation-duration: .17s }

        @keyframes flagWipe  { to { clip-path: inset(0 0 0 0) } }
        @keyframes wheelSpin { to { transform: rotate(360deg) } }
        @keyframes kartShake { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-.6px) } }

        .loader-brand {
            font-family: -apple-system, "Segoe UI", Arial, sans-serif;
            font-weight: 900;
            font-style: italic;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #161616;
            font-size: 19px;
        }
        .loader-brand::after {
            content: "";
            display: inline-block;
            width: 6px; height: 6px;
            margin-left: 4px;
            border-radius: 50%;
            background: #E10600;
        }

        @media (prefers-reduced-motion: reduce) {
            .loader-lights b, .loader-kart, .loader-kart .whl,
            #loading-overlay.finish .loader-fill::after { animation: none }
            .loader-lights b { background: #E10600 }
            #loading-overlay.finish .loader-fill::after { clip-path: inset(0 0 0 0) }
        }
    </style>
</head>
<body>
<canvas id="compose-root"></canvas>

<div id="loading-overlay">
    <div class="loader-box">
        <div class="loader-lights"><b></b><b></b><b></b><b></b><b></b></div>
        <div class="loader-track">
            <div class="loader-road">
                <div class="loader-dash"></div>
                <div class="loader-fill"></div>
            </div>
            <svg class="loader-kart" viewBox="0 0 320 105" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <ellipse cx="164" cy="94" rx="146" ry="5" fill="#000" opacity=".3"/>
                <g stroke="#0d0d0f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
                    <path d="M6 26 L20 24 L20 62 L6 62 Z" fill="#E10600"/>
                    <path d="M18 28 L58 25 L58 37 L18 40 Z" fill="#E10600"/>
                    <path d="M22 42 L56 40 L56 49 L22 51 Z" fill="#3a3a44"/>
                    <path d="M36 51 L36 66" fill="none"/>
                    <path d="M50 76 L272 74 L272 85 L54 87 Q48 87 48 81 Z" fill="#17171c"/>
                    <path d="M46 60 Q46 52 57 51 L112 47 Q142 43 152 41 L180 41 L183 49 L216 51 L216 84 L58 84 Q46 84 46 74 Z" fill="#33333c"/>
                    <path d="M46 60 Q46 52 57 51 L104 48 L104 84 L58 84 Q46 84 46 74 Z" fill="#E10600"/>
                    <path d="M212 50 Q242 54 264 63 L290 75 L290 84 L212 84 Z" fill="#33333c"/>
                    <path d="M110 58 Q110 50 124 49 L198 46 L198 84 L110 84 Z" fill="#3a3a44"/>
                    <path d="M184 50 L198 49 Q206 49 206 57 L206 68 L184 68 Z" fill="#17171c"/>
                    <path d="M148 41 Q146 27 158 23 L170 23 Q182 27 179 41 Z" fill="#E10600"/>
                    <path d="M182 45 Q187 37 200 38 L210 48 L183 50 Z" fill="#17171c"/>
                    <path d="M268 76 L314 73 L314 84 L268 87 Z" fill="#33333c"/>
                    <path d="M302 64 L316 63 L316 87 L302 88 Z" fill="#E10600"/>
                </g>
                <g stroke="#0d0d0f" stroke-width="3" stroke-linecap="round" fill="none">
                    <path d="M92 60 L112 52"/><path d="M96 72 L118 70"/>
                    <path d="M228 62 L212 56"/><path d="M232 74 L214 72"/>
                </g>
                <circle cx="192" cy="32" r="9.5" fill="#f4f4f6" stroke="#0d0d0f" stroke-width="3.5"/>
                <path d="M182.5 30 Q184 21 192 20 Q200 21 201.5 29 L201.5 32 L182.5 32 Z" fill="#E10600"/>
                <path d="M183 34 Q189 30 197 31 L197 38 Q186 39 183 35 Z" fill="#17171c"/>
                <circle cx="68" cy="62" r="25" fill="#17171c" stroke="#0d0d0f" stroke-width="4"/>
                <g class="whl">
                    <circle cx="68" cy="62" r="15.5" fill="none" stroke="#E10600" stroke-width="3.5" stroke-dasharray="49 49"/>
                    <circle cx="68" cy="62" r="10" fill="#4a4a54" stroke="#0d0d0f" stroke-width="3"/>
                    <g stroke="#17171c" stroke-width="2.4">
                        <path d="M68 53 L68 71"/><path d="M60 57 L76 67"/><path d="M60 67 L76 57"/>
                    </g>
                </g>
                <circle cx="238" cy="64" r="23" fill="#17171c" stroke="#0d0d0f" stroke-width="4"/>
                <g class="whl">
                    <circle cx="238" cy="64" r="14" fill="none" stroke="#E10600" stroke-width="3.5" stroke-dasharray="44 44"/>
                    <circle cx="238" cy="64" r="9" fill="#4a4a54" stroke="#0d0d0f" stroke-width="3"/>
                    <g stroke="#17171c" stroke-width="2.2">
                        <path d="M238 56 L238 72"/><path d="M231 60 L245 68"/><path d="M231 68 L245 60"/>
                    </g>
                </g>
                <g fill="#f4f4f6">
                    <circle cx="120" cy="55" r="1.8"/><circle cx="127" cy="54" r="1.8"/>
                    <circle cx="134" cy="53" r="1.8"/><circle cx="141" cy="52" r="1.8"/>
                </g>
                <path d="M206 42 L214 40 L214 44 L206 45 Z" fill="#17171c" stroke="#0d0d0f" stroke-width="2"/>
            </svg>
        </div>
    </div>
    <div class="loader-brand">Апекс</div>
</div>

<script>
    // Локальная разработка (localhost/127.0.0.1) — оставляем пусто, клиент падает на
    // VolnaApiClient.DEFAULT_BASE_URL (http://localhost:8090).
    // Продакшн-деплой — публичный URL задеплоенного бэкенда «Апекс» на Render.
    window.__API_BASE_URL__ =
        (location.hostname === "localhost" || location.hostname === "127.0.0.1")
            ? ""
            : "https://summer-school-2026.onrender.com";

    (function () {
        var overlay = document.getElementById("loading-overlay");
        var box = document.querySelector(".loader-box");

        var LAUNCH_MS = 585;   // огни погасли — можно ехать (78% от их 750мс)
        var MIN_SHOW_MS = 950; // из кеша грузится мгновенно — не мигаем прелоадером
        var SPRINT_MS = 430;   // рывок от текущей точки до финишной черты
        var CEIL = 0.85;       // предел заезда, пока готовность не подтверждена
        var TAU = 2.4;         // постоянная времени подхода к пределу, сек

        // Длительность загрузки заранее неизвестна, поэтому «доехать ровно к концу»
        // по таймеру нельзя. Вместо этого болид асимптотически подползает к 85%
        // трассы и ждёт там, а реальный сигнал готовности переводит его в рывок
        // через финишную черту. Цикла нет: заезд всегда заканчивается один раз и
        // ровно в тот момент, когда приложение готово.
        var t0 = performance.now();
        var p = 0, sprinting = false, sprintFrom = 0, sprintAt = 0;
        var ready = false, done = false;

        function frame(now) {
            var elapsed = now - t0;

            if (sprinting) {
                var k = Math.min(1, (now - sprintAt) / SPRINT_MS);
                p = sprintFrom + (1 - sprintFrom) * (1 - Math.pow(1 - k, 3));
                box.style.setProperty("--p", p.toFixed(4));
                if (k >= 1) { crossLine(); return; }
            } else {
                if (elapsed > LAUNCH_MS) {
                    p = CEIL * (1 - Math.exp(-((elapsed - LAUNCH_MS) / 1000) / TAU));
                    box.style.setProperty("--p", p.toFixed(4));
                }
                if (ready && elapsed >= MIN_SHOW_MS) {
                    sprinting = true;
                    sprintFrom = p;
                    sprintAt = now;
                    overlay.classList.add("finish");
                }
            }
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        function markReady() { ready = true; }

        function crossLine() {
            if (done) return;
            done = true;
            overlay.classList.add("finishing");
            setTimeout(function () { overlay.classList.add("hidden"); }, 240);
        }

        // Готовность определяем по двум РЕАЛЬНЫМ сигналам, а не по таймауту:
        //   1) оба .wasm докачаны (PerformanceObserver) — window.load для этого не годится,
        //      wasm фетчится уже из кода volna-web.js, после события load;
        //   2) пошли ровные кадры анимации. Пока браузер компилирует ~13 МБ wasm, главный
        //      поток заблокирован и requestAnimationFrame не вызывается; как только кадры
        //      идут стабильно — компиляция позади и Compose рисует.
        //
        // Размер буфера канваса как сигнал не годится: Skiko рендерит через WebGL2 и
        // оставляет атрибуты canvas дефолтными (300x150), масштабируя через CSS, —
        // проверка на изменение размера не срабатывала никогда.
        function waitForSteadyFrames() {
            var startedAt = performance.now();
            var previous = startedAt;
            var steady = 0;

            requestAnimationFrame(function tick(now) {
                var delta = now - previous;
                previous = now;
                steady = delta < 50 ? steady + 1 : 0;

                if (steady >= 8 || now - startedAt > 12000) {
                    markReady();
                    return;
                }
                requestAnimationFrame(tick);
            });
        }

        var wasmLoaded = 0;
        if (window.PerformanceObserver) {
            new PerformanceObserver(function (list) {
                list.getEntries().forEach(function (entry) {
                    if (entry.name.endsWith(".wasm") && ++wasmLoaded >= 2) {
                        waitForSteadyFrames();
                    }
                });
            }).observe({ type: "resource", buffered: true });
        } else {
            waitForSteadyFrames();
        }

        // Страховка: что-то пошло не так — прелоадер не должен висеть вечно.
        setTimeout(markReady, 20000);
    })();
</script>
<script src="skiko.js"></script>
<script src="volna-web.js"></script>
</body>
</html>
