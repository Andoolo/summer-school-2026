name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: Backend (Go build + vet + test)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volna
          POSTGRES_USER: volna
          POSTGRES_PASSWORD: volna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volna -d volna"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://volna:volna@localhost:5432/volna?sslmode=disable
      TEST_DATABASE_URL: postgres://volna:volna@localhost:5432/volna?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: apply migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.24.1 -dir migrations postgres "$DATABASE_URL" up

      - name: go test
        run: go test ./...

  client-build:
    name: Client (Kotlin Multiplatform build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: compile shared (common + wasmJs)
        run: ./gradlew :shared:compileKotlinWasmJs --console=plain
