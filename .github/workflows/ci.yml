name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Матрица по обоим приложениям: «Волна» (референс) и «Апекс» (картинг-версия).
  # Раньше проверялась только «Волна», и весь картинговый код — включая расчёты
  # трассы и лидерборд — в CI не попадал вовсе.
  backend:
    name: Backend · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: volna
            dir: backend
          - app: apex
            dir: karting-apex/backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volna
          POSTGRES_USER: volna
          POSTGRES_PASSWORD: volna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volna -d volna"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      DATABASE_URL: postgres://volna:volna@localhost:5432/volna?sslmode=disable
      TEST_DATABASE_URL: postgres://volna:volna@localhost:5432/volna?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: gofmt
        # Проверяем форматирование отдельным шагом: go vet его не ловит.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы (запустите gofmt -w):"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: apply migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.24.1 -dir migrations postgres "$DATABASE_URL" up

      - name: go test
        run: go test ./...

  backend-lint:
    name: Backend lint · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: volna
            dir: backend
          - app: apex
            dir: karting-apex/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - uses: golangci/golangci-lint-action@v8
        with:
          # Версия закреплена намеренно: с 'latest' экшен подтянул сборку на go1.24,
          # а проект целится в go1.25 — линтер отказывается читать такой модуль.
          version: v2.12.2
          working-directory: ${{ matrix.dir }}

  vulncheck:
    # Известные уязвимости в зависимостях и стандартной библиотеке Go, до которых код
    # реально дотягивается: govulncheck смотрит граф вызовов, а не только go.mod.
    name: Vulncheck · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: volna
            dir: backend
          - app: apex
            dir: karting-apex/backend
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Последний патч ветки: уязвимости стандартной библиотеки закрываются именно им.
          check-latest: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: govulncheck
        # v1.8.0 требует Go 1.26, проект пока на 1.25.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  secrets:
    # Токены и ключи во всей истории git. Ложные срабатывания исключены в .gitleaks.toml.
    name: Secrets · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"
          curl -sSfLO "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  client:
    name: Client · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: volna
            dir: client
          - app: apex
            dir: karting-apex/client
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: run tests (commonTest)
        # Общие тесты выполняются на JVM-таргете: он не требует ни Android SDK, ни macOS,
        # ни браузера, поэтому одинаково запускается и в CI, и на машине разработчика.
        # Android-таргет тоже подошёл бы на ubuntu-раннере, но локально без SDK не заводится,
        # а wasmJs требует поднимать браузер через karma и заметно медленнее.
        # JVM-таргет есть только у «Апекса»: у клиента «Волны» задачи jvmTest нет, и шаг
        # падал с «task 'jvmTest' not found». «Волна» проверяется компиляцией ниже.
        if: matrix.app == 'apex'
        run: ./gradlew :shared:jvmTest --console=plain

      - name: compile shared (common + wasmJs)
        run: ./gradlew :shared:compileKotlinWasmJs --console=plain

      - name: compile Android app (apex)
        # Платформенный код Android (хранилища токенов и темы, MainActivity) иначе не
        # компилируется нигде: локально нет Android SDK. На ubuntu-раннере SDK уже стоит.
        if: matrix.app == 'apex'
        run: ./gradlew :androidApp:compileDebugKotlin --console=plain

  client-ios:
    # iOS-код (NSUserDefaults-хранилища токенов и темы) компилируется только на macOS:
    # ни на Linux-раннере, ни на Windows-машине разработчика Kotlin/Native под iOS не
    # собирается. Отдельная задача, чтобы не гонять весь клиентский набор на дорогом раннере.
    name: Client · apex · iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: karting-apex/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: compile shared for iOS simulator (arm64)
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --console=plain

  e2e:
    # Сквозные проверки «Апекса»: бот через настоящий вебхук (имитатор Telegram Bot API)
    # и собранное веб-приложение в headless Chrome. Стенд поднимает karting-apex/e2e/run.sh —
    # тот же скрипт, что и локально; что проверяется — karting-apex/e2e/README.md.
    name: E2E · apex
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          # cdp.mjs использует встроенный в Node 22 WebSocket.
          node-version: '22'

      - name: e2e (бот + веб)
        run: bash karting-apex/e2e/run.sh

      - name: логи и скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apex
          path: karting-apex/e2e/out/
          if-no-files-found: ignore
