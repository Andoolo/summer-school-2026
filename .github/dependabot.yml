# Обновления зависимостей «Апекса» раз в неделю: по одному сгруппированному PR на экосистему.
# «Волна» (референс, не деплоится) сюда не входит, чтобы не удваивать PR; её уязвимости
# всё равно ловит job «Vulncheck · volna».
version: 2
updates:
  - package-ecosystem: gomod
    directory: /karting-apex/backend
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /karting-apex/client
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    # Только патчи. Минорные версии здесь не безопаснее мажорных: Kotlin 2.2→2.4 или
    # kotlinx-datetime 0.7→0.8 (Instant переехал в kotlin.time) ломают сборку, а Kotlin, Compose
    # и AGP связаны и обновляются только вместе. Такие обновления — плановой миграцией.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker
    directory: /karting-apex/backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
