    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8BD1F1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8BD1F1" stop-opacity="0.06"/>
