  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <!-- волны -->
  <path d="M0,196 C160,166 260,226 420,196 C580,166 700,226 1000,190 L1000,260 L0,260 Z" fill="url(#wave)"/>
  <path d="M0,220 C180,196 300,244 480,218 C660,192 820,244 1000,214 L1000,260 L0,260 Z" fill="#8BD1F1" opacity="0.14"/>

